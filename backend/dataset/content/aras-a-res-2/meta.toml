[metadata]
dataset_name = "aras-a-res-2"
description = "Smart home activity recognition dataset from ARAS (Activity Recognition And Ambient Sensing) project"
source = "ARAS Project"
num_residents = 1

[sensors.metadata.CO1]
type = "contact"
area = "entrance"
object = "door"

