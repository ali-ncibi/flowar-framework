name: flowar

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowar:latest
    container_name: flowar-app
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Optional: run the end-to-end demo pipeline (scripts/demo.py)
  # Usage: docker compose --profile demo run demo
  demo:
    image: flowar:latest
    profiles: ["demo"]
    container_name: flowar-demo
    command: ["uv", "run", "--no-sync", "python", "scripts/demo.py"]
    stdin_open: true
    tty: true
